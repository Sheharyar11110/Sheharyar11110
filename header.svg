<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#070b1a"/>
<stop offset="0.55" stop-color="#0d0a24"/>
<stop offset="1" stop-color="#150726"/>
</linearGradient>
<linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#a78bfa"/>
<stop offset="0.33" stop-color="#22d3ee"/>
<stop offset="0.66" stop-color="#f472b6"/>
<stop offset="1" stop-color="#fbbf24"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1040 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8b5cf6"/>
<stop offset="0.5" stop-color="#06b6d4"/>
<stop offset="1" stop-color="#ec4899"/>
</linearGradient>
<linearGradient id="borderGrad" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1150" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#8b5cf6"/>
<stop offset="0.5" stop-color="#22d3ee"/>
<stop offset="1" stop-color="#f472b6"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
<stop offset="0.5" stop-color="#0891b2" stop-opacity="0.55"/>
<stop offset="1" stop-color="#db2777" stop-opacity="0.55"/>
</linearGradient>
<linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#db2777" stop-opacity="0.45"/>
<stop offset="0.5" stop-color="#7c3aed" stop-opacity="0.45"/>
<stop offset="1" stop-color="#06b6d4" stop-opacity="0.45"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
<feGaussianBlur stdDeviation="8" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
</pattern>
<clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
</defs>
<style>
.blob{mix-blend-mode:screen;transform-box:fill-box;transform-origin:center}
.b1{animation:m1 14s ease-in-out infinite alternate}
.b2{animation:m2 17s ease-in-out infinite alternate}
.b3{animation:m3 12s ease-in-out infinite alternate}
.b4{animation:m4 19s ease-in-out infinite alternate}
@keyframes m1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(260px,80px) scale(1.25)}}
@keyframes m2{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(-300px,-40px) scale(.85)}}
@keyframes m3{0%{transform:translate(0,0)}100%{transform:translate(180px,-90px) scale(1.3)}}
@keyframes m4{0%{transform:translate(0,0)}100%{transform:translate(-200px,60px) scale(1.2)}}
.p{fill:#fff;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-420px);opacity:0}}
.fade{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
.name{filter:url(#glow)}
.role{opacity:0;animation:roles 12s infinite both}
.r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
@keyframes roles{0%{opacity:0;transform:translateY(14px)}4%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.4s .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.card{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ln{opacity:0;animation:type .5s ease forwards}
@keyframes type{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:translateX(0)}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.ring2{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite reverse}
@keyframes spin{100%{transform:rotate(360deg)}}
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
</style>

<g clip-path="url(#frame)">
<rect width="1200" height="400" fill="url(#bg)"/>

<g filter="url(#blur)">
<circle class="blob b1" cx="180" cy="90" r="170" fill="#7c3aed" opacity="0.75"/>
<circle class="blob b2" cx="1000" cy="110" r="180" fill="#06b6d4" opacity="0.55"/>
<circle class="blob b3" cx="560" cy="360" r="160" fill="#ec4899" opacity="0.55"/>
<circle class="blob b4" cx="900" cy="330" r="130" fill="#f59e0b" opacity="0.35"/>
</g>

<rect width="1200" height="400" fill="url(#grid)"/>

<g opacity="0.35">
<circle class="ring" cx="930" cy="200" r="168" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="4 10"/>
<circle class="ring2" cx="930" cy="200" r="196" fill="none" stroke="url(#lineGrad)" stroke-width="1" stroke-dasharray="60 24 6 24"/>
</g>

<g>
<circle class="p" cx="80" cy="420" r="1.6" style="animation-duration:9s;animation-delay:0s"/>
<circle class="p" cx="210" cy="420" r="2.2" style="animation-duration:11s;animation-delay:2s"/>
<circle class="p" cx="330" cy="420" r="1.4" style="animation-duration:8s;animation-delay:4s"/>
<circle class="p" cx="450" cy="420" r="2" style="animation-duration:12s;animation-delay:1s"/>
<circle class="p" cx="590" cy="420" r="1.5" style="animation-duration:10s;animation-delay:5s"/>
<circle class="p" cx="660" cy="420" r="2.4" style="animation-duration:13s;animation-delay:3s"/>
<circle class="p" cx="760" cy="420" r="1.3" style="animation-duration:9s;animation-delay:6s"/>
<circle class="p" cx="850" cy="420" r="2" style="animation-duration:11s;animation-delay:0.5s"/>
<circle class="p" cx="980" cy="420" r="1.6" style="animation-duration:10s;animation-delay:2.5s"/>
<circle class="p" cx="1090" cy="420" r="2.2" style="animation-duration:12s;animation-delay:4.5s"/>
<circle class="p" cx="1160" cy="420" r="1.4" style="animation-duration:8s;animation-delay:1.5s"/>
<circle class="p" cx="140" cy="420" r="1.2" style="animation-duration:14s;animation-delay:7s"/>
<circle class="p" cx="520" cy="420" r="1.2" style="animation-duration:15s;animation-delay:8s"/>
</g>

<!-- Left: intro -->
<g class="fade" style="animation-delay:.1s">
<rect x="70" y="58" width="172" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
<circle class="dot" cx="92" cy="75" r="5" fill="#22c55e"/>
<circle cx="92" cy="75" r="5" fill="#22c55e"/>
<text x="106" y="80.5" font-size="14" font-weight="600" fill="#d1fae5" letter-spacing="0.5">Open to work</text>
</g>

<g class="fade" style="animation-delay:.3s">
<text x="70" y="142" font-size="28" font-weight="500" fill="#cbd5e1">Hi there, I'm</text>
</g>

<g class="fade" style="animation-delay:.5s">
<text class="name" x="66" y="222" font-size="86" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.5">Sheharyar</text>
</g>

<rect class="bar" x="70" y="246" width="300" height="4" rx="2" fill="url(#lineGrad)"/>

<g font-size="26" font-weight="600">
<text class="role r1" x="70" y="296"><tspan class="mono" fill="#22d3ee">&gt; </tspan><tspan fill="#e2e8f0">Full-Stack Developer</tspan></text>
<text class="role r2" x="70" y="296"><tspan class="mono" fill="#a78bfa">&gt; </tspan><tspan fill="#e2e8f0">Python · FastAPI Backends</tspan></text>
<text class="role r3" x="70" y="296"><tspan class="mono" fill="#f472b6">&gt; </tspan><tspan fill="#e2e8f0">AI · LLMs · RAG · Agents</tspan></text>
<text class="role r4" x="70" y="296"><tspan class="mono" fill="#fbbf24">&gt; </tspan><tspan fill="#e2e8f0">Kafka · Redis · Docker</tspan></text>
</g>

<g class="fade" style="animation-delay:1.1s">
<text x="70" y="336" font-size="16" fill="#94a3b8">React · TypeScript · Three.js  ✦  building fast, scalable web apps</text>
</g>

<!-- Right: code card -->
<g class="fade" style="animation-delay:.7s">
<g class="card">
<rect x="720" y="72" width="420" height="250" rx="18" fill="#0b1224" fill-opacity="0.72" stroke="url(#borderGrad)" stroke-width="1.6"/>
<rect x="720" y="72" width="420" height="40" rx="18" fill="#ffffff" fill-opacity="0.04"/>
<circle cx="746" cy="92" r="6" fill="#ff5f57"/>
<circle cx="766" cy="92" r="6" fill="#febc2e"/>
<circle cx="786" cy="92" r="6" fill="#28c840"/>
<text class="mono" x="930" y="97" font-size="13" fill="#64748b" text-anchor="middle">developer.ts</text>

<g class="mono" font-size="16">
<text class="ln" x="746" y="146" style="animation-delay:1.2s"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> dev </tspan><tspan fill="#94a3b8">= {</tspan></text>
<text class="ln" x="766" y="174" style="animation-delay:1.6s"><tspan fill="#7dd3fc">name</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Sheharyar"</tspan><tspan fill="#94a3b8">,</tspan></text>
<text class="ln" x="766" y="202" style="animation-delay:2.0s"><tspan fill="#7dd3fc">web</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#94a3b8">],</tspan></text>
<text class="ln" x="766" y="230" style="animation-delay:2.4s"><tspan fill="#7dd3fc">api</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"FastAPI"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Node"</tspan><tspan fill="#94a3b8">],</tspan></text>
<text class="ln" x="766" y="258" style="animation-delay:2.8s"><tspan fill="#7dd3fc">infra</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Kafka"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Redis"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Docker"</tspan><tspan fill="#94a3b8">],</tspan></text>
<text class="ln" x="766" y="286" style="animation-delay:3.2s"><tspan fill="#7dd3fc">ai</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">true</tspan><tspan fill="#94a3b8">,</tspan></text>
<text class="ln" x="746" y="310" style="animation-delay:3.6s"><tspan fill="#94a3b8">};</tspan></text>
<rect class="caret" x="770" y="296" width="9" height="18" fill="#22d3ee" opacity="0.9"/>
</g>
</g>
</g>

<!-- Bottom waves -->
<path fill="url(#wave1)">
<animate attributeName="d" dur="9s" repeatCount="indefinite"
values="M0 360 C200 330 400 390 600 360 C800 330 1000 390 1200 360 V400 H0 Z;
M0 365 C200 395 400 335 600 365 C800 395 1000 335 1200 365 V400 H0 Z;
M0 360 C200 330 400 390 600 360 C800 330 1000 390 1200 360 V400 H0 Z"/>
</path>
<path fill="url(#wave2)">
<animate attributeName="d" dur="7s" repeatCount="indefinite"
values="M0 378 C250 395 450 360 700 378 C900 392 1050 365 1200 378 V400 H0 Z;
M0 375 C250 360 450 395 700 375 C900 362 1050 392 1200 375 V400 H0 Z;
M0 378 C250 395 450 360 700 378 C900 392 1050 365 1200 378 V400 H0 Z"/>
</path>
</g>
</svg>
